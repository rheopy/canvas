name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate the canvas JSON
        run: python3 -c "
          import json
          c = json.load(open('ecosystem.canvas'))
          ids = {n['id'] for n in c['nodes']}
          assert len(ids) == len(c['nodes']), 'duplicate node id'
          for n in c['nodes']:
              assert {'id','type','x','y','width','height'} <= set(n), n.get('id')
          for e in c['edges']:
              assert e['fromNode'] in ids and e['toNode'] in ids, e.get('id')
          print(f\"canvas OK: {len(c['nodes'])} nodes, {len(c['edges'])} edges\")
          "
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
